"$schema" = 'https://starship.rs/config-schema.json'

# Netrunner, see ~/.themes/Netrunner and ~/.config/ghostty/themes/netrunner.conf
#
#   $lineHi   #2b344d   brackets
#   $dim      #4d5772   faint text
#   $muted    #7a85a6   secondary text, also ANSI 8 in netrunner.conf
#   $textDk   #c6d0e0   renamed files
#   $text     #e8f0f8   default foreground
#   $blue     #6e86e0   identity, staged changes
#   $cyan     #4e93a8   python
#   $cyanLt   #86c8dc   modified files, go
#   $violet   #8a68c8   terraform
#   $violetLt #b492ec   hugo
#   $amber    #e0a868   directory, rust, behind
#   $amberLt  #ffd79a   stashed, zig
#   $ok       #48b878   up to date, ahead
#   $redDk    #b84856   deleted files
#   $bad      #e05a6a   errors, conflicts, ruby

add_newline=false
#scan_timeout = 10
format = '$character$directory'
right_format = '$terraform$c$zig$odin$golang$rust$ruby$python${custom.hugo}([\[](#2b344d)$git_state$git_status$git_metrics$git_branch$git_commit[\]](#2b344d))$battery'

[character]
success_symbol = '[](#6e86e0)'
error_symbol = '[](#e05a6a)'
vicmd_symbol = '[△](#48b878)'

[directory]
style = '#e0a868'

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
rebase = '[rebasing](bold magenta)'
merge = '[merging](bold yellow)'
revert = '[reverting](bold blue)'
cherry_pick = '[picking](bold red)'
bisect = '[bisecting](bold red)'
am = '[applying](bold green)'
am_or_rebase = '[applying/rebasing](bold yellow)'

[git_status]
format = '($all_status$ahead_behind )'
style = '8'
up_to_date = '[](#48b878)'
untracked = '[.](#7a85a6)'
conflicted = '[#](#e05a6a)'
ahead = '[⇡](#48b878)'
behind = '[⇣](#e0a868)'
diverged = '[⇕](#e05a6a)'
stashed = '[^](#ffd79a)'
modified = '[*](#86c8dc)'
staged = '[+](#6e86e0)'
renamed = '[»](#c6d0e0)'
deleted = '[x](#b84856)'

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style)'
symbol = ''
style = '8'
truncation_length = 16
truncation_symbol = ''
ignore_branches = []

[git_commit]
format = ' [$hash$tag]($style)'
style = '8'
only_detached = false
commit_hash_length = 6
tag_symbol = ''

[git_metrics]
disabled = true
added_style = '#48b878'
deleted_style = '#e05a6a'
format = '([+$added]($added_style))([-$deleted]($deleted_style)) '

[c]
format = '[$symbol($version )]($style)'
style = '#7a85a6'
symbol = ' '

[golang]
format = '[$symbol($version )]($style)'
style = '#86c8dc'
symbol = ' '

[odin]
format = '[$symbol($version )]($style)'
style = '#6e86e0'
symbol = 'Ø '

[python]
format = '[$symbol($version )]($style)'
style = '#4e93a8'
symbol = ' '

[ruby]
format = '[$symbol($version )]($style)'
style = '#e05a6a'
symbol = ' '

[rust]
format = '[$symbol($version )]($style)'
style = '#e0a868'
symbol = ' '

[terraform]
format = '[$symbol$workspace]($style)'
style = '#8a68c8'
symbol = ' '

[zig]
format = '[$symbol($version )]($style)'
style = '#ffd79a'
symbol = ' '

[custom.hugo]
format = '[$symbol($output )]($style)'
style = '#b492ec'
symbol = ' '
command = "hugo version | cut -d ' ' -f2 | cut -d '+' -f1"
when = "test -f $(git rev-parse --show-toplevel)/config/_default/config.*"
require_repo = true

[battery]
full_symbol = '\[F\]'
charging_symbol = '\[+\]'
discharging_symbol = '\[-\]'
empty_symbol = '\[ \]'
unknown_symbol = '\[?\]'
format = ' [$percentage](#7a85a6) [$symbol]($style)'
[[battery.display]]
threshold = 25
style = '#e0a868'
